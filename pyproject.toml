[project]
name = "ap-trainer"
version = "0.6.0"
description = "Lernbegleiter für die AP1 der IT-Berufe (Fachinformatik Systemintegration)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    # Content-Pipeline (tools/)
    "pypdf>=4.2",
    "pdfplumber>=0.11",
    "beautifulsoup4>=4.12",
    "openpyxl>=3.1",
    # Programm (src/ap_trainer)
    "nicegui>=2.10,<3",
    "fsrs>=5,<7",
]

[project.scripts]
ap-trainer = "ap_trainer.__main__:main"
ap-tools = "tools.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-PyYAML",
    "pre-commit>=3.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_trainer", "tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = ["quellen", "build"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# Deutsche Texte enthalten typografische Zeichen (–, „“), die RUF001–003 sonst melden.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["src", "."]
packages = ["ap_trainer", "tools"]

[[tool.mypy.overrides]]
module = ["pdfplumber", "pypdf", "bs4", "openpyxl", "yaml", "fsrs", "nicegui", "nicegui.*"]
ignore_missing_imports = true

# Ohne installiertes NiceGUI (schlanke Umgebungen) sind dessen Dekoratoren untypisiert.
[[tool.mypy.overrides]]
module = ["ap_trainer.ui.*", "ap_trainer.__main__"]
disallow_untyped_decorators = false
