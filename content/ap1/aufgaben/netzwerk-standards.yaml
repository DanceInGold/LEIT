# Aufgaben zum Thema „Ethernet- und WLAN-Standards, LWL“.
# Passend zur Lektion netzwerk-standards.

aufgaben:
  - id: std-wifi-namen
    typ: zuordnung
    stufe: 1
    titel: "Wi-Fi-Namen und IEEE-Standards"
    frage: "Ordne jedem Wi-Fi-Namen den IEEE-Standard zu."
    paare:
      - {links: "Wi-Fi 4", rechts: "802.11n"}
      - {links: "Wi-Fi 5", rechts: "802.11ac"}
      - {links: "Wi-Fi 6", rechts: "802.11ax"}
      - {links: "Wi-Fi 7", rechts: "802.11be"}
    ablenker: ["802.3bt"]
    hinweise:
      - "802.3 ist Ethernet über Kabel, 802.11 ist WLAN."
    loesungsweg: "Wi-Fi 4 = 802.11**n** · Wi-Fi 5 = 802.11**ac** · Wi-Fi 6 = 802.11**ax** · Wi-Fi 7 = 802.11**be**. 802.3bt ist PoE."
    quelle: "Neu erstellt (Claude), WLAN-Tabelle der Lektion netzwerk-standards."
    belege:
      - {titel: "Wi-Fi Alliance: Wi-Fi 6, Wi-Fi 6E, Wi-Fi 7", url: "https://www.wi-fi.org/discover-wi-fi"}
    status: ungeprüft

  - id: std-name-luecke
    typ: lueckentext
    stufe: 1
    titel: "1000BASE-T lesen"
    frage: "Ergänze, wofür die Teile der Bezeichnung stehen."
    text: "In 1000BASE-T steht 1000 für die Datenrate in {{1}}, BASE für {{2}} und T für {{3}}."
    luecken:
      - antworten: ["Mbit/s", "Megabit pro Sekunde", "Mbit"]
        falsch:
          - {antwort: "MB/s", warum: "Netzwerkraten werden in Bit pro Sekunde angegeben, nicht in Byte.", ursache: begriff}
      - antworten: ["Basisband"]
      - antworten: ["Twisted Pair", "verdrilltes Kupferkabel", "Twisted-Pair"]
    hinweise:
      - "1000 Mbit/s = 1 Gbit/s."
    loesungsweg: "1000 = **Mbit/s** (1 Gbit/s) · BASE = **Basisband** · T = **Twisted Pair**."
    quelle: "Neu erstellt (Claude), Erklärung der Namen in der Lektion netzwerk-standards."
    belege:
      - {titel: "IEEE 802.3 Ethernet Working Group", url: "https://www.ieee802.org/3/"}
    status: ungeprüft

  - id: std-kabel-wahl
    typ: multiple_choice
    stufe: 2
    titel: "Welches Kabel für 10 Gigabit?"
    situation: "Im Serverraum soll ein neuer Server über **10GBASE-T** angebunden werden. Die Kabelstrecke bis zum Switch ist **80 m** lang."
    frage: "Welche Kabelkategorie brauchst du mindestens?"
    optionen:
      - {text: "Cat 6A", richtig: true, warum: "Cat 6A schafft 10 Gbit/s über die vollen 100 m."}
      - {text: "Cat 6", warum: "Cat 6 reicht für 10 Gbit/s nur bis etwa 55 m.", ursache: konzept}
      - {text: "Cat 5e", warum: "Cat 5e ist für Gigabit gedacht, nicht für 10 Gigabit.", ursache: begriff}
      - {text: "Cat 5", warum: "Cat 5 reicht nur für Fast Ethernet (100 Mbit/s).", ursache: begriff}
    hinweise:
      - "Die Länge ist entscheidend: Cat 6 hat bei 10 Gbit/s eine Grenze."
    loesungsweg: "10GBASE-T über 80 m → **Cat 6A** (Cat 6 nur bis ca. 55 m)."
    quelle: "Neu erstellt (Claude), Ethernet-Tabelle der Lektion netzwerk-standards."
    belege:
      - {titel: "IEEE 802.3an-2006 (10GBASE-T)", url: "https://www.ieee802.org/3/"}
    status: ungeprüft

  - id: std-funkbaender
    typ: zuordnung
    stufe: 2
    titel: "2,4 GHz oder 5/6 GHz?"
    frage: "Ordne jede Eigenschaft dem passenden Frequenzband zu."
    paare:
      - {links: "größere Reichweite, besser durch Wände", rechts: "2,4 GHz"}
      - {links: "viele Störungen durch Nachbarnetze und Bluetooth", rechts: "2,4 GHz"}
      - {links: "höhere Datenrate", rechts: "5/6 GHz"}
      - {links: "mehr Kanäle, weniger Störungen", rechts: "5/6 GHz"}
    hinweise:
      - "Höhere Frequenz: mehr Daten, aber geringere Reichweite."
    loesungsweg: "**2,4 GHz:** weit, aber langsamer und gestört. **5/6 GHz:** schneller, mehr Kanäle, kürzere Reichweite."
    quelle: "Neu erstellt (Claude), Tabelle der Lektion netzwerk-standards."
    belege:
      - {titel: "IEEE 802.11 Wireless LAN Working Group", url: "https://www.ieee802.org/11/"}
    status: ungeprüft

  - id: std-backup-rechnen
    typ: rechnung
    stufe: 3
    titel: "Passt die Sicherung ins Zeitfenster?"
    situation: "Ein Archivserver der ArchivTech GmbH soll nachts **3 TB** (dezimal) auf ein Sicherungssystem übertragen. Das Zeitfenster beträgt **5 Stunden**. Rechne ohne Overhead."
    frage: "Reicht Gigabit-Ethernet (1 Gbit/s), oder braucht es 10 Gbit/s?"
    schritte:
      - frage: "Datenmenge in Bit"
        antwort: "24000000000000"
        einheit: "Bit"
        erklaerung: "3 × 10¹² Byte × 8 = 2,4 × 10¹³ Bit."
        falsch:
          - {antwort: "3000000000000", warum: "Byte nicht in Bit umgerechnet (× 8).", ursache: rechenfehler}
      - frage: "Übertragungszeit bei 1 Gbit/s in Stunden"
        antwort: "6,67"
        einheit: "h"
        erklaerung: "2,4 × 10¹³ Bit ÷ 10⁹ bit/s = 24.000 s ÷ 3.600 = 6,67 h."
        falsch:
          - {antwort: "0,83", warum: "Ohne × 8 gerechnet: Leitungen übertragen Bit, Speicher zählen Byte.", ursache: rechenfehler}
          - {antwort: "400", warum: "Das sind Minuten. In Stunden: 24.000 s ÷ 3.600 = 6,67 h.", ursache: rechenfehler}
      - frage: "Übertragungszeit bei 10 Gbit/s in Minuten"
        antwort: "40"
        einheit: "min"
        erklaerung: "2,4 × 10¹³ ÷ 10¹⁰ = 2.400 s ÷ 60 = 40 min."
      - frage: "Reicht 1 Gbit/s für das Zeitfenster? (ja/nein)"
        antwort: "nein"
        format: text
        erklaerung: "6,67 h > 5 h – mit 10 Gbit/s (40 min) passt es locker."
        falsch:
          - {antwort: "ja", warum: "6,67 Stunden sind mehr als das Zeitfenster von 5 Stunden.", ursache: rechenfehler}
    hinweise:
      - "Erst Byte in Bit umrechnen, dann durch die Datenrate teilen."
      - "1 Gbit/s = 10⁹ bit/s, 1 TB = 10¹² Byte."
      - "3 × 10¹² × 8 = ?"
    loesungsweg: |
      1. 3 × 10¹² Byte × 8 = **2,4 × 10¹³ Bit**
      2. ÷ 10⁹ bit/s = 24.000 s = **6,67 h** → **zu lang** für 5 h
      3. ÷ 10¹⁰ bit/s = 2.400 s = **40 min**
    quelle: "Neu erstellt (Claude), nach dem Rechenbeispiel der Lektion netzwerk-standards mit anderen Zahlen; nachgerechnet."
    belege:
      - {titel: "IEEE 802.3 Ethernet Working Group (1000BASE-T, 10GBASE-T)", url: "https://www.ieee802.org/3/"}
    status: ungeprüft

  - id: std-lwl-gebaeude
    typ: multiple_choice
    stufe: 3
    titel: "Verbindung zum zweiten Gebäude"
    situation: "Die ArchivTech GmbH bezieht eine zweite Lagerhalle auf dem Gelände, **1,5 km** entfernt. Beide Gebäude sollen mit 10 Gbit/s verbunden werden."
    frage: "Welche Verbindung ist geeignet, und warum? (**zwei** richtige)"
    optionen:
      - {text: "Singlemode-LWL, weil er viele Kilometer überbrückt", richtig: true, warum: "Multimode reicht nur einige Hundert Meter; für 1,5 km braucht es Singlemode."}
      - {text: "LWL verhindert Probleme durch unterschiedliches Erdpotential zwischen den Gebäuden", richtig: true, warum: "Glas leitet keinen Strom – es braucht keinen Potentialausgleich."}
      - {text: "Multimode-LWL, weil er für alle Strecken die günstigste Optik hat", warum: "Günstiger ja, aber zu kurze Reichweite für 1,5 km.", ursache: konzept}
      - {text: "Cat 6A-Kupferkabel mit 10GBASE-T", warum: "Kupfer ist auf 100 m begrenzt.", ursache: konzept}
    hinweise:
      - "Wie weit reicht Kupfer, wie weit Multimode?"
      - "Was passiert, wenn zwei Gebäude unterschiedliches Erdpotential haben und ein Kupferkabel sie verbindet?"
    loesungsweg: "**Singlemode-LWL**: Kilometer-Reichweite, störfest, **kein Potentialausgleich** nötig. Kupfer endet bei 100 m, Multimode bei einigen Hundert Metern."
    quelle: "Neu erstellt (Claude), LWL-Tabelle und Praxisbezug der Lektion netzwerk-standards."
    belege:
      - {titel: "IEEE 802.3ae (10-Gigabit-Ethernet über LWL, z. B. 10GBASE-LR über Singlemode bis 10 km)", url: "https://www.ieee802.org/3/"}
    status: ungeprüft

  - id: std-wlan-freitext
    typ: freitext
    stufe: 4
    operator: erläutern
    titel: "„Auf der Packung stand 9,6 Gbit/s“"
    situation: "Ein Kunde hat einen Wi-Fi-6-Accesspoint gekauft („bis zu 9,6 Gbit/s“). Mit seinem Notebook misst er 400 Mbit/s und beschwert sich."
    frage: "Erläutere dem Kunden, warum die gemessene Rate deutlich unter der Angabe liegt."
    musterloesung: |
      - Die **9,6 Gbit/s** sind eine theoretische **Bruttorate**: alle Antennen und Bänder zusammen unter Laborbedingungen.
      - Das Notebook hat meist **nur zwei Antennen** und nutzt **ein Band** – damit ist nur ein Bruchteil möglich.
      - WLAN ist ein **geteiltes Medium**: Alle Geräte am Accesspoint teilen sich die Funkzeit.
      - **Protokoll-Overhead**, Abstand, Wände und **Nachbarnetze** senken die Nutzrate weiter.
    bewertungspunkte:
      - {punkt: "Angabe ist theoretische Bruttorate (Summe aller Antennen, Laborbedingungen)", kernbegriffe: ["brutto", "theoret", "labor", "antenne"]}
      - {punkt: "geteiltes Medium: Geräte teilen sich die Rate", kernbegriffe: ["geteilt", "teilen"]}
      - {punkt: "Overhead, Abstand, Wände oder Störungen", kernbegriffe: ["overhead", "wand", "wände", "abstand", "stör"]}
    hinweise:
      - "Was misst die Zahl auf der Verpackung – und was misst das Notebook?"
    loesungsweg: "Angabe = theoretische Bruttorate aller Antennen; das Notebook nutzt weniger Antennen; geteiltes Medium; Overhead, Abstand und Störungen."
    quelle: "Neu erstellt (Claude), Vertiefung „Warum ist WLAN langsamer als die Zahl auf der Verpackung?“ der Lektion netzwerk-standards."
    belege:
      - {titel: "IEEE 802.11 Wireless LAN Working Group", url: "https://www.ieee802.org/11/"}
    status: ungeprüft
