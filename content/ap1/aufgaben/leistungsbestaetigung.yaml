# Aufgaben zum Thema „Bestätigung erbrachter Leistungen, Nachkalkulation, Folgeaufträge“.
# Passend zur Lektion abnahme-leistung.

aufgaben:
  - id: leistung-begriffe
    typ: zuordnung
    stufe: 1
    titel: "Nach dem Projekt"
    frage: "Ordne jedem Begriff seine Bedeutung zu."
    paare:
      - {links: "Leistungsbestätigung", rechts: "Kunde bestätigt Art und Umfang der erbrachten Leistung – Grundlage der Rechnung"}
      - {links: "Nachkalkulation", rechts: "geplante und tatsächliche Kosten vergleichen"}
      - {links: "Folgeauftrag", rechts: "weiterer Auftrag, z. B. Wartungsvertrag oder Erweiterung"}
      - {links: "Abnahme", rechts: "Kunde billigt das Werk als vertragsgemäß"}
    hinweise:
      - "Was braucht man für die Rechnung, was für die nächste Kalkulation?"
    loesungsweg: "Leistungsbestätigung = Grundlage der Rechnung · Nachkalkulation = Plan gegen Ist · Folgeauftrag = weiterer Auftrag · Abnahme = Billigung."
    quelle: "Neu erstellt (Claude), Abschnitt „Leistungsbestätigung, Nachkalkulation, Folgeaufträge“ der Lektion abnahme-leistung."
    belege:
      - {titel: "Prüfungskatalog AP1 2025, Unterpunkt 07.08 (laut katalog.yaml)"}
    status: geprüft

  - id: leistung-nachkalk-rechnen
    typ: rechnung
    stufe: 3
    titel: "Nachkalkulation eines Einsatzes"
    situation: "Für die Einrichtung eines Archivsystems hat die ArchivTech **24 Stunden** zu **75 €** kalkuliert. Laut Leistungsbestätigung des Kunden wurden **30 Stunden** gearbeitet. Vereinbart war ein **Festpreis** in Höhe der Kalkulation."
    frage: "Werte die Nachkalkulation aus."
    schritte:
      - frage: "kalkulierte Kosten (Festpreis) in €"
        antwort: "1800"
        einheit: "€"
        erklaerung: "24 h × 75 € = 1.800 €."
      - frage: "tatsächliche Kosten in €"
        antwort: "2250"
        einheit: "€"
        erklaerung: "30 h × 75 € = 2.250 €."
      - frage: "Abweichung gegenüber der Kalkulation in %"
        antwort: "25"
        einheit: "%"
        erklaerung: "(2.250 − 1.800) ÷ 1.800 = 450 ÷ 1.800 = 0,25 = 25 % mehr."
        falsch:
          - {antwort: "20", warum: "Durch die Ist-Kosten geteilt (450 ÷ 2.250). Bezugsgröße ist die Kalkulation.", ursache: rechenfehler}
      - frage: "Kann die ArchivTech beim Festpreis die Mehrstunden berechnen? (ja/nein)"
        antwort: "nein"
        format: text
        erklaerung: "Beim Festpreis trägt der Auftragnehmer das Risiko der Mehrstunden – die 450 € schmälern den Gewinn. Lehre für die nächste Kalkulation."
        falsch:
          - {antwort: "ja", warum: "Ein Festpreis gilt unabhängig vom Aufwand, wenn nichts anderes vereinbart ist.", ursache: konzept}
    hinweise:
      - "Abweichung in % = (Ist − Plan) ÷ Plan."
      - "Was bedeutet „Festpreis“ für Mehraufwand?"
    loesungsweg: |
      1. Plan: 24 × 75 € = **1.800 €**
      2. Ist: 30 × 75 € = **2.250 €**
      3. Abweichung: 450 ÷ 1.800 = **25 %**
      4. Festpreis → Mehrkosten **nicht** berechenbar; Kalkulation für ähnliche Aufträge anpassen.
    quelle: "Neu erstellt (Claude), passend zur Nachkalkulation der Lektionen abnahme-leistung und kalkulation; nachgerechnet."
    belege:
      - {titel: "Lektion „Kalkulation“ (Nachkalkulation, Abweichung bezogen auf den Plan)"}
    status: geprüft

  - id: leistung-folgeauftrag-freitext
    typ: freitext
    stufe: 4
    operator: beschreiben
    titel: "Folgeaufträge vorbereiten"
    situation: "Das Projekt „Archivserver beim Kunden Nord GmbH“ ist abgenommen. Die Geschäftsleitung der ArchivTech möchte die Kundenbeziehung ausbauen."
    frage: "Beschreibe zwei mögliche Folgeaufträge und wie die Leistungsbestätigung und eine saubere Abnahme dabei helfen."
    musterloesung: |
      **Mögliche Folgeaufträge:**
      - **Wartungsvertrag** mit Monitoring, Updates und festgelegten Reaktionszeiten (SLA)
      - **Erweiterung**, z. B. zusätzlicher Speicher oder Replikation in ein zweites Rechenzentrum
      - **Schulung** der Mitarbeitenden des Kunden

      **Warum die Unterlagen helfen:** Die Leistungsbestätigung dokumentiert, was erbracht wurde – Grundlage für die Rechnung und eine faire Kalkulation des Folgeangebots. Eine saubere Abnahme ohne Streit schafft Vertrauen; zufriedene Kunden beauftragen wieder.
    bewertungspunkte:
      - {punkt: "zwei sinnvolle Folgeaufträge (Wartung, Erweiterung, Schulung)", kernbegriffe: ["wartung", "erweiter", "schulung"]}
      - {punkt: "Nutzen von Leistungsbestätigung/Abnahme (Nachweis, Vertrauen, Kalkulation)", kernbegriffe: ["vertrauen", "nachweis", "kalkulation", "zufrieden"]}
    hinweise:
      - "Was braucht ein Server nach der Einrichtung dauerhaft?"
    loesungsweg: "Wartungsvertrag, Erweiterung oder Schulung; Leistungsbestätigung als Nachweis und Kalkulationsgrundlage, saubere Abnahme schafft Vertrauen."
    quelle: "Neu erstellt (Claude), passend zur Lektion abnahme-leistung."
    belege:
      - {titel: "Prüfungskatalog AP1 2025, Unterpunkt 07.08: Folgeaufträge (laut katalog.yaml)"}
    status: geprüft
