# Aufgaben zum Thema „Schutzziele: Vertraulichkeit, Integrität, Verfügbarkeit“.
# Passend zur Lektion schutzziele.

aufgaben:
  - id: schutz-grundwerte-zuordnen
    typ: zuordnung
    stufe: 1
    titel: "Die drei Grundwerte"
    frage: "Ordne jedem Schutzziel seine Bedeutung zu."
    paare:
      - {links: "Vertraulichkeit", rechts: "Nur Befugte können die Informationen lesen"}
      - {links: "Integrität", rechts: "Daten sind korrekt und nicht unbemerkt verändert"}
      - {links: "Verfügbarkeit", rechts: "Systeme und Daten sind nutzbar, wenn sie gebraucht werden"}
      - {links: "Authentizität", rechts: "Daten stammen wirklich vom angegebenen Absender"}
    ablenker: ["Daten sind möglichst klein komprimiert"]
    hinweise:
      - "Lesen – Verändern – Ausfall: drei Gefahren, drei Grundwerte."
      - "Authentizität gehört zu den erweiterten Schutzzielen."
    loesungsweg: "Vertraulichkeit = Lesen nur für Befugte · Integrität = unverändert · Verfügbarkeit = nutzbar · Authentizität = echter Absender (erweitertes Ziel)."
    quelle: "Neu erstellt (Claude), passend zur Lektion schutzziele."
    belege:
      - {titel: "BSI-Standard 200-2: IT-Grundschutz-Methodik (Grundwerte Vertraulichkeit, Integrität, Verfügbarkeit)", url: "https://dhge.de/DHGE/dam/jcr:d14c502f-f112-475b-aace-64f5f6041088/BSI_Standard_200-2.pdf"}
    status: ungeprüft

  - id: schutz-vorfall-zuordnen
    typ: zuordnung
    stufe: 2
    titel: "Welches Schutzziel ist verletzt?"
    frage: "Ordne jedem Vorfall das Schutzziel zu, das **in erster Linie** verletzt ist."
    paare:
      - {links: "Ein Praktikant öffnet versehentlich Personalakten im Archiv.", rechts: "Vertraulichkeit"}
      - {links: "Ein Skript ändert unbemerkt Rechnungsbeträge in der Datenbank.", rechts: "Integrität"}
      - {links: "Nach einem Stromausfall ist das Ticketsystem einen Tag lang nicht erreichbar.", rechts: "Verfügbarkeit"}
      - {links: "Ein Bewerber löscht seine eigene Bewerbung im Portal und sie ist danach weg.", rechts: "Verfügbarkeit"}
    hinweise:
      - "Gelesen → Vertraulichkeit, verändert → Integrität, weg oder nicht erreichbar → Verfügbarkeit."
    loesungsweg: "Gelesen = **Vertraulichkeit** · verändert = **Integrität** · nicht erreichbar oder gelöscht = **Verfügbarkeit**."
    quelle: "Neu erstellt (Claude), passend zur Lektion schutzziele."
    belege:
      - {titel: "BSI-Standard 200-2: IT-Grundschutz-Methodik", url: "https://dhge.de/DHGE/dam/jcr:d14c502f-f112-475b-aace-64f5f6041088/BSI_Standard_200-2.pdf"}
    status: ungeprüft

  - id: schutz-massnahme-luecke
    typ: lueckentext
    stufe: 2
    titel: "Maßnahmen je Schutzziel"
    frage: "Fülle die Lücken jeweils mit dem passenden Schutzziel."
    text: "Eine Verschlüsselung der Archivfestplatten schützt vor allem die {{1}}. Eine Datensicherung mit Kopie außer Haus schützt vor allem die {{2}}. Ein Hashwert über jede archivierte Datei schützt vor allem die {{3}}."
    luecken:
      - antworten: ["Vertraulichkeit"]
        falsch:
          - {antwort: "Verfügbarkeit", warum: "Verschlüsselung verhindert Lesen, nicht Ausfall – sie kann die Verfügbarkeit sogar gefährden, wenn der Schlüssel fehlt.", ursache: konzept}
      - antworten: ["Verfügbarkeit"]
        falsch:
          - {antwort: "Integrität", warum: "Eine Sicherung stellt verlorene Daten wieder her – das ist Verfügbarkeit.", ursache: begriff}
      - antworten: ["Integrität"]
        falsch:
          - {antwort: "Vertraulichkeit", warum: "Ein Hash macht nichts geheim; er zeigt, ob sich etwas verändert hat.", ursache: begriff}
    hinweise:
      - "Frag dich: Wogegen schützt die Maßnahme – Lesen, Verändern oder Ausfall?"
    loesungsweg: "Verschlüsselung → **Vertraulichkeit** · Datensicherung → **Verfügbarkeit** · Hashwert → **Integrität**."
    quelle: "Neu erstellt (Claude), Tabelle der Lektion schutzziele."
    belege:
      - {titel: "BSI-Standard 200-2: IT-Grundschutz-Methodik", url: "https://dhge.de/DHGE/dam/jcr:d14c502f-f112-475b-aace-64f5f6041088/BSI_Standard_200-2.pdf"}
    status: ungeprüft

  - id: schutz-ransomware
    typ: multiple_choice
    stufe: 3
    titel: "Ransomware mit Datenabfluss"
    situation: "Bei einem Kunden der ArchivTech verschlüsselt eine Ransomware die Fileserver. Die Angreifer haben vorher 40 GB Kundendaten heruntergeladen und drohen mit der Veröffentlichung."
    frage: "Welche **zwei** Schutzziele sind sicher verletzt?"
    optionen:
      - {text: "Verfügbarkeit", richtig: true, warum: "Die verschlüsselten Daten sind nicht mehr nutzbar."}
      - {text: "Vertraulichkeit", richtig: true, warum: "Die Angreifer haben die Daten gelesen und kopiert."}
      - {text: "Verbindlichkeit", warum: "Es geht nicht darum, dass jemand eine Handlung abstreiten könnte.", ursache: begriff}
      - {text: "Keines – die Daten sind ja noch vorhanden, nur verschlüsselt", warum: "Daten, die niemand mehr nutzen kann, sind nicht verfügbar.", ursache: konzept}
    hinweise:
      - "Prüfe alle drei Grundwerte einzeln."
      - "Was passiert durch das Verschlüsseln, was durch das Herunterladen?"
    loesungsweg: "Verschlüsseln → **Verfügbarkeit** weg. Herunterladen → **Vertraulichkeit** verletzt. Ob die Integrität betroffen ist, lässt sich erst nach Prüfung sagen."
    quelle: "Neu erstellt (Claude), Beispiel der Lektion schutzziele."
    belege:
      - {titel: "BSI: Ransomware – Bedrohungslage, Prävention & Reaktion", url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Cyber-Sicherheitslage/Analysen-und-Prognosen/Ransomware-Angriffe/ransomware-angriffe_node.html"}
    status: ungeprüft

  - id: schutz-massnahmen-freitext
    typ: freitext
    stufe: 4
    operator: beschreiben
    titel: "Maßnahmen für das Artifactory"
    situation: "Im Artifactory der ArchivTech liegen alle Build-Artefakte, die Jenkins erzeugt und die anschließend beim Kunden installiert werden. Die Teamleitung möchte die drei Grundwerte absichern."
    frage: "Beschreibe für jedes der drei Schutzziele eine Bedrohung und eine passende Maßnahme."
    musterloesung: |
      | Schutzziel | Bedrohung | Maßnahme |
      | --- | --- | --- |
      | Vertraulichkeit | Unbefugte laden interne Artefakte herunter | Berechtigungskonzept, Anmeldung nur mit persönlichem Konto, HTTPS |
      | Integrität | Ein Artefakt wird manipuliert und mit Schadcode ausgeliefert | Prüfsummen (SHA-256) und Signaturen, Schreibrechte nur für Jenkins |
      | Verfügbarkeit | Speicher fällt aus, Builds und Auslieferung stehen | Datensicherung, Redundanz, Monitoring |
    bewertungspunkte:
      - {punkt: "Vertraulichkeit: Bedrohung und Maßnahme (z. B. Berechtigungen, HTTPS)", kernbegriffe: ["vertraulich"]}
      - {punkt: "Integrität: Bedrohung und Maßnahme (z. B. Hash, Signatur, Schreibrechte)", kernbegriffe: ["integrität"]}
      - {punkt: "Verfügbarkeit: Bedrohung und Maßnahme (z. B. Backup, Redundanz)", kernbegriffe: ["verfügbar"]}
    hinweise:
      - "Lesen, Verändern, Ausfall – je eine Bedrohung."
      - "Eine Maßnahme muss genau zur Bedrohung passen."
    loesungsweg: "Je Schutzziel eine konkrete Bedrohung und eine passende Maßnahme – z. B. Berechtigungen, Signaturen und Datensicherung."
    quelle: "Neu erstellt (Claude), passend zur Lektion schutzziele."
    belege:
      - {titel: "BSI IT-Grundschutz-Kompendium", url: "https://www.bsi.bund.de/DE/Themen/Unternehmen-und-Organisationen/Standards-und-Zertifizierung/IT-Grundschutz/IT-Grundschutz-Kompendium/it-grundschutz-kompendium_node.html"}
    status: ungeprüft
