# Themenbaum AP1 – ENTWURF (Phase 1).
#
# Grundlage: Änderungstabelle des IT-Berufe-Podcasts #190 (quellen/pruefung/…-190.pdf),
# die nur das DELTA zwischen Katalog 2020 und 2025 zeigt, plus die Cluster der
# Prüfungsauswertung aus docs/anforderungen.md (Kap. 2). Der vollständige Katalog ist
# bestellt (F-01) und wird nach Eintreffen integriert.
#
# Felder je Thema:
#   id               stabile Themen-ID (ER-07: über Paketversionen hinweg unverändert)
#   katalog          Unterpunkt(e) im Prüfungskatalog 2025, soweit bekannt
#   cluster          Cluster der Prüfungsauswertung (Grundlage der Gewichtung, LP-07)
#   stand_2025       aktiv | neu | entfallen | ausserhalb (nicht im Katalog, freiwillig)
#   voraussetzungen  Themen-IDs, die vorher sitzen sollten (LP-03)
#   gewicht          nur für Sonderfälle gesetzt; sonst berechnet core/weighting.py das
#                    Gewicht aus dem Block „gewichtung“ (E-12). Entfallen = 0.
#   aufwand_h        geschätzter Lernaufwand in Stunden: Erarbeiten + Üben (LP-08),
#                    ohne Wiederholung – der Zuschlag steht unter gewichtung.wiederholungszuschlag

version: "2025-entwurf-2"
status: entwurf

gewichtung:
  methode: "vorläufig (E-12): Einzelthemen mit bekannten Punkten direkt, restliche Clusterpunkte gleichmäßig auf die übrigen aktiven Themen des Clusters; entfallene Themen 0; neue Themen mindestens Mindestgewicht; Ergebnis normiert auf 100. Nach Katalog-Eingang neu berechnen."
  # Punkte aus 11 AP1-Prüfungen Herbst 2021 bis Herbst 2026 (IT-Berufe-Podcast, Anforderungen Kap. 2)
  cluster_punkte:
    "Hardware": 142
    "Netzwerktechnik": 140
    "IT-Sicherheit": 132
    "Softwareentwicklung": 120
    "Projektmanagement": 104
    "Datenbanken": 81
    "Wirtschaftlichkeit": 78
    "Angebotsvergleich": 77
    "Kundenberatung/Präsentieren": 72
    "Multimedia": 51
    "Datenschutz": 22
    "Märkte und Bedarfe": 21
    "Verträge": 15
    "Leistungserbringung": 14
    "Kundenbeziehungen": 9
    "UML": 9
    "Betriebssysteme": 4
    "Software": 4
    "Algorithmen": 2
  # punktstärkste Einzelthemen (Anforderungen Kap. 2) → Themen-ID
  einzelthemen_punkte:
    angebotsvergleich: 45      # Nutzwertanalyse
    erm-relational: 42         # ERM
    schreibtischtest: 41
    projektplanung: 35         # Netzplan
    kalkulation: 33            # Kosten berechnen
    datenmengen-uebertragung: 29  # Dateigrößen berechnen
    ipv6: 28
  mindestgewicht: 0.5          # Prozentpunkte für neue Themen ohne eigene Punkte
  wiederholungszuschlag: 0.2   # +20 % auf den Aufwand für Wiederholungen (LP-08)

bereiche:
  - id: b01
    name: "Planen, Projekte, Wirtschaftlichkeit"
  - id: b02
    name: "Kundenberatung, Angebote, Kommunikation"
  - id: b03
    name: "Marktgängige IT-Systeme: Hardware, Software, Netzwerk"
  - id: b04
    name: "Einrichten und Installieren, Programmierung, Daten"
  - id: b05
    name: "Qualitätssicherung"
  - id: b06
    name: "IT-Sicherheit und Datenschutz"
  - id: b07
    name: "Leistungserbringung, Verträge, Abnahme"

