# Themenbaum AP1 – ENTWURF aus Phase 0.
#
# Grundlage: Änderungstabelle des IT-Berufe-Podcasts #190 (quellen/pruefung/…-190.pdf),
# die nur das DELTA zwischen Katalog 2020 und 2025 zeigt, plus die Cluster der
# Prüfungsauswertung aus docs/anforderungen.md (Kap. 2).
# Der vollständige Prüfungskatalog 2025 liegt NICHT im Repo (siehe docs/inventur.md,
# offene Frage F-01). Unterpunkte, die sich 2025 nicht geändert haben, sind daher hier
# nur so weit erfasst, wie sie aus dem Delta oder den Kommentaren hervorgehen.
#
# Felder:
#   id            stabile Themen-ID (ER-07: über Paketversionen hinweg unverändert)
#   katalog       Unterpunkt(e) im Prüfungskatalog 2025, soweit bekannt
#   cluster       Cluster der Prüfungsauswertung (für die Gewichtung, LP-07)
#   stand_2025    aktiv | neu (2025 ergänzt/präzisiert) | entfallen | ausserhalb (nicht im Katalog)
#   voraussetzungen  Themen-IDs, die vorher sitzen sollten (LP-03)
#   gewicht       folgt nach Abgleich mit dem vollständigen Katalog (Regel: Kap. 2); entfallen = 0
#   aufwand_h     folgt (LP-08)

