id: selbstkosten
begriff: Selbstkosten
kurz: Alle Kosten, die eine Ware oder Leistung dem Unternehmen verursacht – noch ohne Gewinn.
erklaerung: 'Auch: Selbstkostenpreis. In der Handelskalkulation: Bezugspreis + Handlungskosten. Auf die
  Selbstkosten wird der Gewinnzuschlag gerechnet. Liegt der Verkaufspreis darunter, macht das Unternehmen
  Verlust.'
beispiel: 4.000,00 € + 1.000,00 € = 5.000,00 € Selbstkosten; + 12 % Gewinn = 5.600,00 € Barverkaufspreis.
verwandt:
- handlungskostenzuschlag
- listenverkaufspreis
- stundensatz
thema: kalkulation
quelle: Neu erstellt (Claude); Belege siehe zugehörige Lektion.
status: ungeprüft
