      - nr: d
        punkte: 5
        aufgabe:
          typ: rechnung
          thema: wirtschaftlichkeit
          titel: "Lohnt sich der Chatbot?"
          frage: "Ein Chatbot kostet einmalig **4.800 €** für die Einrichtung und **100 € pro Monat** im Betrieb. Er spart dem Kundenservice voraussichtlich **25 Stunden pro Monat**; eine Stunde kostet das Bohnenwerk **32 €**."
          schritte:
            - frage: "Eingesparte Personalkosten pro Monat in €"
              antwort: "800"
              einheit: "€"
              erklaerung: "25 h × 32 € = 800 €."
            - frage: "Monatliche Ersparnis nach Abzug der Betriebskosten in €"
              antwort: "700"
              einheit: "€"
              erklaerung: "800 € − 100 € = 700 €."
            - frage: "Amortisationszeit in Monaten (zwei Nachkommastellen)"
              antwort: "6,86"
              einheit: "Monate"
              toleranz: 0.001
              erklaerung: "4.800 € ÷ 700 €/Monat = 6,86 Monate – im 7. Monat ist die Investition wieder drin."
              falsch:
                - {antwort: "6", warum: "Mit 800 € gerechnet – die Betriebskosten mindern die monatliche Ersparnis.", ursache: rechenfehler}
          loesungsweg: "25 × 32 € = **800 €**; − 100 € = **700 €** pro Monat; 4.800 € ÷ 700 € = **6,86 Monate**."

