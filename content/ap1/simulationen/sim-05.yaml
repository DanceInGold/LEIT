            - {text: "MAC-Adresse des Routers", warum: "Die ermittelt der Server selbst per ARP.", ursache: konzept}
            - {text: "Adresse des DHCP-Servers", warum: "Bei statischer Konfiguration wird kein DHCP genutzt.", ursache: konzept}
