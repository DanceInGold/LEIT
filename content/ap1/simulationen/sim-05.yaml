          frage: "Der neue Druckserver im Lager bekommt eine statische IPv4-Konfiguration. Welche **zwei** Angaben brauchst du neben der IP-Adresse mit Präfix, damit er Ziele im Internet per Namen erreicht?"
          optionen:
