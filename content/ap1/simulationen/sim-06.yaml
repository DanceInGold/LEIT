      - nr: b
        punkte: 8
        aufgabe:
          typ: rechnung
          thema: schreibtischtest
          titel: "Schreibtischtest mit verschachtelter Schleife"
          frage: |
            Führe einen Schreibtischtest für diesen Algorithmus durch.

            ```text
            ergebnis ← 0
            FÜR i ← 1 BIS 3
                FÜR j ← 1 BIS i
                    ergebnis ← ergebnis + j
                ENDE FÜR
            ENDE FÜR
            AUSGABE ergebnis
            ```
          schritte:
            - frage: "Wert von ergebnis nach dem äußeren Durchlauf mit i = 1"
              antwort: "1"
              erklaerung: "Innen nur j = 1: 0 + 1 = 1."
            - frage: "Wert von ergebnis nach dem äußeren Durchlauf mit i = 2"
              antwort: "4"
              erklaerung: "j = 1 und j = 2: 1 + 1 + 2 = 4."
              falsch:
                - {antwort: "3", warum: "Nur j = 2 addiert. Die innere Schleife beginnt jedes Mal wieder bei j = 1.", ursache: konzept}
            - frage: "Ausgabe"
              antwort: "10"
              erklaerung: "i = 3: j = 1, 2, 3 → 4 + 1 + 2 + 3 = 10."
              falsch:
                - {antwort: "6", warum: "Nur das jeweils letzte j addiert (1 + 2 + 3). Die innere Schleife läuft jedes Mal von 1 bis i.", ursache: konzept}
          loesungsweg: |
            | i | j-Werte | Zuwachs | ergebnis |
            | ---: | --- | ---: | ---: |
            | 1 | 1 | 1 | 1 |
            | 2 | 1, 2 | 3 | 4 |
            | 3 | 1, 2, 3 | 6 | **10** |

