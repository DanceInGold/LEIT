            - {text: "Öffentliche Attribute machen die Klasse sicherer, weil jeder sie korrigieren kann.", warum: "Dann kann jeder ungültige Werte setzen – das Gegenteil von Kapselung.", ursache: konzept}
          loesungsweg: "Kapselung: Attribute **privat**, Zugriff über **Methoden**; Setter prüfen Werte. Keine Verschlüsselung."

