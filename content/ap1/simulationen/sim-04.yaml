      - nr: d
        punkte: 8
        aufgabe:
          typ: rechnung
          thema: erm-relational
          titel: "Datenbank für Termine"
          frage: |
            Für die Terminverwaltung hast du dieses ER-Modell entworfen: Ein Patient hat beliebig viele Termine, ein Therapeut ebenso; jeder Termin gehört zu genau einem Patienten und genau einem Therapeuten.

            ```mermaid
            erDiagram
              PATIENT ||--o{ TERMIN : bucht
              THERAPEUT ||--o{ TERMIN : betreut
            ```

            Eine Kollegin schlägt stattdessen eine einzige Tabelle vor: **Termin**(TerminNr, Datum, Uhrzeit, PatientNr, PatientName, TherapeutNr) mit dem Primärschlüssel TerminNr.
          schritte:
            - frage: "Anzahl der Tabellen im relationalen Modell nach deinem ER-Modell"
              antwort: "3"
              erklaerung: "Patient, Therapeut, Termin. Zwei 1:n-Beziehungen brauchen keine Zwischentabelle."
              falsch:
                - {antwort: "5", warum: "Für jede 1:n-Beziehung eine Zwischentabelle angelegt. Die braucht man nur bei n:m.", ursache: konzept}
            - frage: "Anzahl der Fremdschlüssel in der Tabelle Termin"
              antwort: "2"
              erklaerung: "PatientNr und TherapeutNr – je einer für jede 1:n-Beziehung auf der n-Seite."
            - frage: "Welche Normalform verletzt der Vorschlag der Kollegin? (1, 2 oder 3)"
              antwort: "3"
              erklaerung: "TerminNr → PatientNr → PatientName: transitive Abhängigkeit, also 3NF verletzt."
              falsch:
                - {antwort: "2", warum: "Bei einem einspaltigen Primärschlüssel ist die 2NF automatisch erfüllt.", ursache: konzept}
                - {antwort: "1", warum: "Alle Werte sind atomar; die 1NF ist erfüllt.", ursache: konzept}
          loesungsweg: |
            - **Patient**(PatientNr, Name, …)
            - **Therapeut**(TherapeutNr, Name, …)
            - **Termin**(TerminNr, Datum, Uhrzeit, ↑PatientNr, ↑TherapeutNr)

            3 Tabellen, 2 Fremdschlüssel in Termin. Der Vorschlag speichert PatientName bei jedem Termin: TerminNr → PatientNr → PatientName ist transitiv → **3NF** verletzt (Änderungsanomalie).
