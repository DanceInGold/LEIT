        aufgabe:
          typ: rechnung
          thema: urheberrecht-lizenzen
          titel: "Named User oder Concurrent User?"
          frage: "Die Praxisverwaltung nutzen **30 Mitarbeitende**, aber höchstens **12 gleichzeitig**. Eine Named-User-Lizenz kostet **120 € pro Jahr**, eine Concurrent-User-Lizenz **280 € pro Jahr**."
          schritte:
            - frage: "Jährliche Kosten mit Named-User-Lizenzen in €"
              antwort: "3600"
              einheit: "€"
              erklaerung: "30 × 120 € = 3.600 €."
            - frage: "Jährliche Kosten mit Concurrent-User-Lizenzen in €"
              antwort: "3360"
              einheit: "€"
              erklaerung: "12 × 280 € = 3.360 €."
              falsch:
                - {antwort: "8400", warum: "Für alle 30 Mitarbeitenden gerechnet. Concurrent-Lizenzen braucht man nur für die gleichzeitigen Nutzer.", ursache: konzept}
            - frage: "Ersparnis pro Jahr mit dem günstigeren Modell in €"
              antwort: "240"
              einheit: "€"
              erklaerung: "3.600 € − 3.360 € = 240 € mit Concurrent User."
          loesungsweg: "Named 30 × 120 € = 3.600 € · Concurrent 12 × 280 € = **3.360 €** → Concurrent spart **240 €**, solange nie mehr als 12 gleichzeitig arbeiten."

